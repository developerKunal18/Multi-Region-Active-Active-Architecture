services:

  region-a:
    build:
      context: ./region_a

    container_name: region-a

  region-b:
    build:
      context: ./region_b

    container_name: region-b

  gateway:

    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - region-a
      - region-b
